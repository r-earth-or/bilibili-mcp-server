version: '3.8'

services:
  bilibili-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilibili-mcp-server
    ports:
      - "8080:8080"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
